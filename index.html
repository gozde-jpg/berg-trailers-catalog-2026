<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Berg Trailers | Digital Catalog</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#1b456e,#06182a 76%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,5vw,72px);background:#041526;border-bottom:2px solid #058bd9}header strong{font-size:19px;letter-spacing:.4px}header strong span{color:#28a9ff}a.download,button{border:0;border-radius:6px;background:#0879c2;color:#fff;font-weight:bold;padding:11px 16px;text-decoration:none;cursor:pointer}button:disabled{opacity:.35;cursor:default}main{text-align:center;padding:22px 12px 28px}.book{display:flex;align-items:center;justify-content:center;min-height:60vh;perspective:1800px}.page{display:block;max-width:min(90vw,660px);max-height:74vh;width:auto;height:auto;box-shadow:0 15px 40px #0009;background:#fff;transform-origin:left center;transition:transform .32s ease,opacity .32s ease}.page.turn{transform:rotateY(-70deg);opacity:.3}.controls{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 24px}.controls span{min-width:105px}#status{font-size:13px;color:#bcd7ef;min-height:20px}footer{font-size:11px;color:#86b7dd;letter-spacing:.3px;padding:12px} @media(max-width:600px){header strong{font-size:15px}a.download{font-size:12px;padding:10px}.page{max-height:68vh}}
</style></head><body>
<header><strong>BERG <span>TRAILERS</span></strong><a class="download" href="Berg_Trailers_Catalog_US_Letter_Michels_Fixed.pdf" download>Download PDF ↓</a></header>
<main><div id="status">Loading catalog…</div><div class="book"><canvas class="page" id="page" aria-label="Catalog page"></canvas></div><div class="controls"><button id="prev" disabled>← Previous</button><span id="counter">Page 1</span><button id="next" disabled>Next →</button></div><footer>BERG TRAILERS | DIGITAL PRODUCT CATALOG</footer></main>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const file='Berg_Trailers_Catalog_US_Letter_Michels_Fixed.pdf';const canvas=document.getElementById('page'),status=document.getElementById('status'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');let pdf=null,current=1,busy=false;
async function render(n){if(!pdf||busy||n<1||n>pdf.numPages)return;busy=true;prev.disabled=next.disabled=true;canvas.classList.add('turn');await new Promise(r=>setTimeout(r,180));try{const page=await pdf.getPage(n);const viewport=page.getViewport({scale:1.8});canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;current=n;counter.textContent=`Page ${n} of ${pdf.numPages}`;status.textContent='';}catch(e){status.textContent='Could not display page: '+e.message}finally{canvas.classList.remove('turn');busy=false;prev.disabled=current===1;next.disabled=current===pdf.numPages}}
prev.onclick=()=>render(current-1);next.onclick=()=>render(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')render(current+1);if(e.key==='ArrowLeft')render(current-1)});
try{pdf=await pdfjsLib.getDocument(encodeURI(file)).promise;await render(1)}catch(e){status.textContent='Catalog could not load. Upload '+file+' beside index.html.';console.error(e)}
</script></body></html>
